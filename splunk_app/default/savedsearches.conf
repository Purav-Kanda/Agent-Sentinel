# splunk_app/default/savedsearches.conf
# ─────────────────────────────────────────────────────────────────────────────
# Saved searches / scheduled alerts for AgentSentinel.
#
# These run automatically in Splunk to catch anomalies even when no human
# is watching the dashboard.
# ─────────────────────────────────────────────────────────────────────────────

# ── Alert: High-severity tool loop detected ───────────────────────────────
[AgentSentinel - Tool Loop Alert]
search          = index=agent_telemetry sourcetype=agent_sentinel span_type=tool_call \
                  | stats count AS total_calls, dc(inputs) AS unique_inputs \
                    BY session_id, agent_id, tool_name \
                  | eval loop_ratio = round((total_calls - unique_inputs) / total_calls, 3) \
                  | where total_calls > 3 AND loop_ratio > 0.6
cron_schedule   = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time   = now
enableSched     = 1
alert.severity  = 3
alert.suppress  = 1
alert.suppress.period = 5m
action.email    = 0
description     = Fires when an AI agent is stuck in a tool-call loop.

# ── Alert: Hallucination risk detected ───────────────────────────────────
[AgentSentinel - Hallucination Risk Alert]
search          = index=agent_telemetry sourcetype=agent_sentinel span_type=anomaly_alert \
                  hallucination_score > 0.6
cron_schedule   = */2 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time   = now
enableSched     = 1
alert.severity  = 2
alert.suppress  = 1
alert.suppress.period = 2m
description     = Fires when the LLM shows strong hallucination signals.

# ── Report: Daily session health summary ─────────────────────────────────
[AgentSentinel - Daily Health Report]
search          = index=agent_telemetry sourcetype=agent_sentinel \
                  | stats count BY agent_id, session_id \
                  | stats dc(session_id) AS sessions, sum(count) AS total_events \
                    BY agent_id
cron_schedule   = 0 8 * * *
dispatch.earliest_time = -24h
dispatch.latest_time   = now
enableSched     = 1
description     = Daily summary of all agent sessions.

# ── Alert: Critical cascade risk ─────────────────────────────────────────
[AgentSentinel - Cascade Risk Critical]
search          = index=agent_telemetry sourcetype=agent_sentinel span_type=anomaly_alert \
                  cascade_risk_score > 0.7
cron_schedule   = */3 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time   = now
enableSched     = 1
alert.severity  = 1
description     = Fires when error cascade risk is critical.
