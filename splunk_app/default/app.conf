# splunk_app/default/app.conf
# ─────────────────────────────────────────────────────────────────────────────
# Splunk app configuration for AgentSentinel.
#
# To install: copy the splunk_app/ folder into $SPLUNK_HOME/etc/apps/
# and restart Splunk.
# ─────────────────────────────────────────────────────────────────────────────

[launcher]
author    = AgentSentinel Team
description = Agentic AI Observability for Splunk – detect hallucinations, \
              tool loops, reasoning drift, and cascade failures in real time.
version   = 1.0.0

[ui]
is_visible = true
label      = AgentSentinel

[package]
id         = agent_sentinel
check_for_updates = false
