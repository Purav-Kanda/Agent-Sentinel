# splunk_app/default/indexes.conf
# Creates the agent_telemetry index that AgentSentinel writes to.
# Copy to $SPLUNK_HOME/etc/apps/agent_sentinel/default/indexes.conf

[agent_telemetry]
# Store up to 5 GB of agent telemetry (adjust for your environment)
maxDataSize    = 5000
maxTotalDataSizeMB = 5000
# Keep data for 90 days
frozenTimePeriodInSecs = 7776000
homePath   = $SPLUNK_DB/agent_telemetry/db
coldPath   = $SPLUNK_DB/agent_telemetry/colddb
thawedPath = $SPLUNK_DB/agent_telemetry/thaweddb
