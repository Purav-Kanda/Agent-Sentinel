# splunk_app/default/props.conf
# Tells Splunk how to parse agent_sentinel events.
# Since we send JSON, we enable automatic JSON key extraction.

[agent_sentinel]
# Treat each event as a single JSON object.
KV_MODE         = json
TIME_PREFIX     = "time":
TIME_FORMAT     = %s
MAX_TIMESTAMP_LOOKAHEAD = 15
TRUNCATE        = 10000
# Ensure the sourcetype is set correctly at index time.
SHOULD_LINEMERGE = false
