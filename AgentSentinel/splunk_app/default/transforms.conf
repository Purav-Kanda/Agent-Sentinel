# splunk_app/default/transforms.conf
# Field extractions for the agent_sentinel sourcetype.
# Because SplunkWriter sends JSON events, most fields are extracted
# automatically by Splunk's JSON key-value extraction.
# These transforms add computed/lookup fields.

[agent_sentinel_severity_lookup]
filename        = severity_map.csv
match_type      = WILDCARD(composite_score)
default_match   = low
case_sensitive_match = false
